<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dariana</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus {
            border-color: #3498db;
            outline: none;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.btn-submit:hover {
            background-color: #27ae60;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Registro</h2>
    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="Ej. juan@example.com">
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required placeholder="Ej. 1234567890">
        </div>
        <button type="submit" class="btn-submit">Guardar Registro</button>
    </form>

    <hr>

    <div class="actions">
        <h2>Registros Guardados</h2>
        <button class="btn-clear" onclick="limpiarRegistros()">Borrar Todo</button>
    </div>

    <div class="table-container">
        <table id="tablaUsuarios">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se agregarán los datos dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Referencias a elementos del DOM
    const form = document.getElementById('registroForm');
    const tablaBody = document.querySelector('#tablaUsuarios tbody');

    // Cargar los datos almacenados en localStorage al iniciar la página
    document.addEventListener('DOMContentLoaded', cargarDatos);

    // Evento al enviar el formulario
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Obtener valores de los campos
        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const telefono = document.getElementById('telefono').value;

        // Crear objeto de usuario
        const usuario = { nombre, email, telefono };

        // Guardar en localStorage (Nuestra "Base de Datos" local)
        guardarEnLocalStorage(usuario);

        // Limpiar el formulario
        form.reset();

        // Recargar la tabla
        cargarDatos();
    });

    // Función para guardar un registro en localStorage
    function guardarEnLocalStorage(usuario) {
        let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
        usuarios.push(usuario);
        localStorage.setItem('usuarios', JSON.stringify(usuarios));
    }

    // Función para leer los datos y mostrarlos en la tabla
    function cargarDatos() {
        tablaBody.innerHTML = '';
        let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

        usuarios.forEach((usuario, index) => {
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${index + 1}</td>
                <td>${usuario.nombre}</td>
                <td>${usuario.email}</td>
                <td>${usuario.telefono}</td>
            `;
            tablaBody.appendChild(fila);
        });
    }

    // Función para borrar todos los registros
    function limpiarRegistros() {
        if (confirm('¿Estás seguro de borrar todos los registros?')) {
            localStorage.removeItem('usuarios');
            cargarDatos();
        }
    }
</script>

</body>
</html>
